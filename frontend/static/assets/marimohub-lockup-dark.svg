<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">MarimoHub logo dark mode</title>
  <desc id="desc">MarimoHub wordmark with a teal notebook and deployment rocket hub icon.</desc>

  <defs>
    <linearGradient id="blobLockupDark" x1="128" y1="112" x2="356" y2="394" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#00C7AD"/>
      <stop offset="0.55" stop-color="#008779"/>
      <stop offset="1" stop-color="#00635E"/>
    </linearGradient>
    <linearGradient id="strokeLockupDark" x1="64" y1="64" x2="448" y2="448" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#00C7AD"/>
      <stop offset="0.55" stop-color="#008779"/>
      <stop offset="1" stop-color="#00998A"/>
    </linearGradient>
    <linearGradient id="wordLockupDark" x1="0" y1="0" x2="760" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#00C7AD"/>
      <stop offset="1" stop-color="#008779"/>
    </linearGradient>
    <filter id="softShadowLockupDark" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#001F1E" flood-opacity="0.18"/>
    </filter>
    <filter id="darkGlowLockupDark" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#00C7AD" flood-opacity="0.25"/>
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.32"/>
    </filter>
    <radialGradient id="bgGlowLockupDark" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0E2427"/>
      <stop offset="55%" stop-color="#071316"/>
      <stop offset="100%" stop-color="#03070A"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="360" fill="url(#bgGlowLockupDark)"/>
  <g transform="translate(62 45) scale(0.53)">
  
    <g id="marimohub-icon" filter="url(#darkGlowLockupDark)">
      <!-- Orbit ring and hub nodes -->
      <g fill="none" stroke="url(#strokeLockupDark)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round">
        <path d="M76 304 A202 202 0 0 1 104 166"/>
        <path d="M124 132 A202 202 0 0 1 222 64"/>
        <path d="M438 283 A202 202 0 0 1 304 438"/>
        <path d="M207 443 A202 202 0 0 1 78 318"/>
        <path d="M304 67 A202 202 0 0 1 431 202" stroke-dasharray="14 18"/>
      </g>
      <g fill="url(#strokeLockupDark)">
        <circle cx="256" cy="55" r="20"/>
        <circle cx="55" cy="256" r="20"/>
        <circle cx="256" cy="457" r="20"/>
        <circle cx="457" cy="256" r="20"/>
      </g>

      <!-- Launch rocket -->
      <g transform="translate(410 103) rotate(38)" fill="url(#strokeLockupDark)">
        <path d="M0 -40 C20 -24 30 4 18 32 C9 26 -9 26 -18 32 C-30 4 -20 -24 0 -40Z"/>
        <path d="M-19 14 L-44 31 L-26 2Z"/>
        <path d="M19 14 L44 31 L26 2Z"/>
        <circle cx="0" cy="-13" r="7" fill="#FAFFFD"/>
        <path d="M0 39 C-5 50 -10 57 -15 65 C-4 61 4 61 15 65 C10 57 5 50 0 39Z"/>
      </g>

      <!-- Organic marimo mark -->
      <path fill="url(#blobLockupDark)" d="M256 96 C297 90 322 122 356 138 C394 155 411 198 402 238 C431 274 412 321 372 342 C344 386 286 407 248 383 C199 401 149 374 134 326 C94 299 88 247 114 211 C107 161 151 132 188 122 C207 103 230 96 256 96Z"/>

      <!-- Notebook/code cell -->
      <g>
        <rect x="176" y="184" width="176" height="144" rx="22" fill="#FAFFFD"/>
        <g stroke="#FAFFFD" stroke-width="10" stroke-linecap="round">
          <line x1="154" y1="211" x2="184" y2="211"/>
          <line x1="154" y1="239" x2="184" y2="239"/>
          <line x1="154" y1="267" x2="184" y2="267"/>
          <line x1="154" y1="295" x2="184" y2="295"/>
        </g>
        <g stroke="#008779" stroke-width="10" stroke-linecap="round" fill="#008779">
          <line x1="226" y1="230" x2="274" y2="230"/>
          <circle cx="294" cy="230" r="6" stroke="none"/>
          <line x1="226" y1="254" x2="254" y2="254"/>
          <line x1="273" y1="254" x2="316" y2="254"/>
          <circle cx="230" cy="282" r="7" stroke="none"/>
          <line x1="255" y1="282" x2="302" y2="282"/>
        </g>
      </g>
    </g>
  </g>
  <text x="390" y="218" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="94" font-weight="760" letter-spacing="-3" fill="url(#wordLockupDark)">MarimoHub</text>
</svg>
