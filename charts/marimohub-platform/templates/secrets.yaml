{{- /*
Every Secret this chart generates, in one file so each value is generated
once per render. Each value is read back with lookup and reused, so helm
upgrade keeps it, and helm.sh/resource-policy: keep leaves it behind on
uninstall. helm template and client-side dry runs cannot look anything up
and render fresh throwaway values instead.
*/}}
{{- $v := .Values }}
{{- $openshift := eq $v.platform "openshift" }}
{{- $online := include "platform.online" . }}
{{- $labels := include "platform.labels" . }}

{{- /* Platform CA: signs the evaluation database certificate and, on the portable profile, the app's Service certificates. */}}
{{- $ca := dict }}
{{- if or $v.postgresql.enabled (not $openshift) }}
{{- $existingCA := lookup "v1" "Secret" .Release.Namespace $v.tls.caSecretName }}
{{- if $existingCA }}
{{- $ca = buildCustomCert (index $existingCA.data "tls.crt") (index $existingCA.data "tls.key") }}
{{- else }}
{{- $ca = genCA "MarimoHub platform CA" (int $v.tls.caValidityDays) }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $v.tls.caSecretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- $labels | nindent 4 }}
  annotations:
    {{- include "platform.keep" . | nindent 4 }}
type: kubernetes.io/tls
data:
  tls.crt: {{ $ca.Cert | b64enc }}
  tls.key: {{ $ca.Key | b64enc }}
{{- end }}

{{- /* Leaf certificates, reissued only when their DNS names or the CA change. */}}
{{- $leaves := list }}
{{- if not $openshift }}
{{- range $component := list "frontend" "backend-public" "backend-internal" }}
{{- $sans := include "platform.serviceSANs" (dict "ctx" $ "component" $component) | fromJsonArray }}
{{- if ne $component "backend-internal" }}{{ $sans = concat $sans $v.tls.publicHosts }}{{ end }}
{{- $leaves = append $leaves (dict "name" (printf "%s-%s-tls" $v.app.releaseName $component) "namespace" $v.namespaces.app "sans" $sans) }}
{{- end }}
{{- end }}
{{- if $v.postgresql.enabled }}
{{- $leaves = append $leaves (dict "name" (printf "%s-tls" $v.postgresql.name) "namespace" $v.namespaces.database "sans" (include "platform.databaseSANs" . | fromJsonArray)) }}
{{- end }}
{{- range $leaf := $leaves }}
{{- $data := dict }}
{{- $args := dict "namespace" $leaf.namespace "name" $leaf.name "sans" $leaf.sans "caCert" $ca.Cert "revision" $.Release.Revision }}
{{- $restartKey := include "platform.leafRestartKey" $args }}
{{- $reusable := include "platform.reusableLeaf" $args }}
{{- if $reusable }}
{{- $data = $reusable | fromJson }}
{{- else }}
{{- $cert := genSignedCert (first $leaf.sans) nil $leaf.sans (int $v.tls.certValidityDays) $ca }}
{{- $data = dict "tls.crt" ($cert.Cert | b64enc) "tls.key" ($cert.Key | b64enc) }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $leaf.name }}
  namespace: {{ $leaf.namespace }}
  labels:
    {{- $labels | nindent 4 }}
  annotations:
    {{- include "platform.keep" $ | nindent 4 }}
    marimohub.io/dns-names-sha256: {{ join "," $leaf.sans | sha256sum }}
    marimohub.io/ca-sha256: {{ $ca.Cert | sha256sum }}
    marimohub.io/restart-key: {{ $restartKey }}
type: kubernetes.io/tls
data:
  tls.crt: {{ index $data "tls.crt" }}
  tls.key: {{ index $data "tls.key" }}
  ca.crt: {{ $ca.Cert | b64enc }}
{{- end }}

{{- /* Evaluation database credentials. PostgreSQL keeps the passwords it was initialised with. */}}
{{- $dbPassword := "" }}
{{- if $v.postgresql.enabled }}
{{- $existingDB := lookup "v1" "Secret" $v.namespaces.database $v.postgresql.name }}
{{- $adminPassword := "" }}
{{- if $existingDB }}
{{- $adminPassword = index $existingDB.data "postgres-password" | b64dec }}
{{- $dbPassword = index $existingDB.data "password" | b64dec }}
{{- else }}
{{- $adminPassword = randAlphaNum 32 }}
{{- $dbPassword = randAlphaNum 32 }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $v.postgresql.name }}
  namespace: {{ $v.namespaces.database }}
  labels:
    {{- $labels | nindent 4 }}
  annotations:
    {{- include "platform.keep" . | nindent 4 }}
type: Opaque
data:
  postgres-password: {{ $adminPassword | b64enc }}
  password: {{ $dbPassword | b64enc }}
{{- end }}

{{- /* The CA that signed the database certificate, for the app (database.tls.caSecretName). */}}
{{- if not $v.database.ca.existingSecret }}
{{- $caBundle := "" }}
{{- if $v.postgresql.enabled }}
{{- $caBundle = $ca.Cert }}
{{- else if $v.database.ca.bundle }}
{{- $caBundle = $v.database.ca.bundle }}
{{- else if $v.database.ca.fromSecret.name }}
{{- $from := $v.database.ca.fromSecret }}
{{- $fromNamespace := $from.namespace | default .Release.Namespace }}
{{- $source := lookup "v1" "Secret" $fromNamespace $from.name }}
{{- if and $source (index ($source.data | default dict) $from.key) }}
{{- $caBundle = index $source.data $from.key | b64dec }}
{{- else if $online }}
{{- fail (printf "database.ca.fromSecret: Secret %s/%s with key %s was not found" $fromNamespace $from.name $from.key) }}
{{- else }}
{{- $caBundle = "offline render: the database CA is read at install time" }}
{{- end }}
{{- end }}
{{- if $caBundle }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $v.database.ca.name }}
  namespace: {{ $v.namespaces.app }}
  labels:
    {{- $labels | nindent 4 }}
  annotations:
    {{- include "platform.keep" . | nindent 4 }}
type: Opaque
data:
  ca.crt: {{ $caBundle | b64enc }}
{{- end }}
{{- end }}

{{- /* DATABASE_URL and SECRET_KEY for both backends, the migration Job and the CronJobs. */}}
{{- if not $v.backendEnv.existingSecret }}
{{- $existingEnv := lookup "v1" "Secret" $v.namespaces.app $v.backendEnv.name }}
{{- $secretKey := "" }}
{{- if and $existingEnv (index ($existingEnv.data | default dict) "SECRET_KEY") }}
{{- $secretKey = index $existingEnv.data "SECRET_KEY" | b64dec }}
{{- else }}
{{- $secretKey = randAlphaNum 64 }}
{{- end }}
{{- $url := "" }}
{{- if $v.postgresql.enabled }}
{{- $url = printf "postgresql+asyncpg://marimohub:%s@%s.%s.svc:5432/marimohub" $dbPassword $v.postgresql.name $v.namespaces.database }}
{{- else }}
{{- $from := $v.database.passwordSecret }}
{{- $fromNamespace := $from.namespace | default .Release.Namespace }}
{{- $source := lookup "v1" "Secret" $fromNamespace $from.name }}
{{- if and $source (index ($source.data | default dict) $from.key) }}
{{- /* Percent-encoded: urlquery writes a space as "+", which a URL's userinfo would keep literally. */}}
{{- $password := index $source.data $from.key | b64dec | urlquery | replace "+" "%20" }}
{{- $user := $v.database.user | urlquery | replace "+" "%20" }}
{{- $url = printf "postgresql+asyncpg://%s:%s@%s:%d/%s" $user $password $v.database.host (int $v.database.port) $v.database.name }}
{{- else if $online }}
{{- fail (printf "database.passwordSecret: Secret %s/%s with key %s was not found; create it before installing" $fromNamespace $from.name $from.key) }}
{{- else }}
{{- $url = "postgresql+asyncpg://offline-render:placeholder@offline-render.invalid:5432/placeholder" }}
{{- end }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $v.backendEnv.name }}
  namespace: {{ $v.namespaces.app }}
  labels:
    {{- $labels | nindent 4 }}
  annotations:
    {{- include "platform.keep" . | nindent 4 }}
type: Opaque
data:
  DATABASE_URL: {{ $url | b64enc }}
  SECRET_KEY: {{ $secretKey | b64enc }}
{{- end }}

{{- /* The CA Runtime Pods trust for the internal API. */}}
{{- $internalCA := "" }}
{{- if $openshift }}
{{- $internalCA = $v.internalApiCA.serviceCABundle }}
{{- if not $internalCA }}
{{- /* service-ca-operator keeps this bundle current, so every upgrade refreshes the copy. */}}
{{- $managed := lookup "v1" "ConfigMap" "openshift-config-managed" "service-ca" }}
{{- if $managed }}{{ $internalCA = index ($managed.data | default dict) "ca-bundle.crt" | default "" }}{{ end }}
{{- end }}
{{- if and (not $internalCA) $online }}
{{- fail "internalApiCA: could not read ConfigMap openshift-config-managed/service-ca (key ca-bundle.crt); set internalApiCA.serviceCABundle, for example with --set-file" }}
{{- end }}
{{- $internalCA = $internalCA | default "offline render: the service CA is read at install time" }}
{{- else }}
{{- $internalCA = $ca.Cert }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $v.internalApiCA.name }}
  namespace: {{ $v.namespaces.sessions }}
  labels:
    {{- $labels | nindent 4 }}
  annotations:
    {{- include "platform.keep" . | nindent 4 }}
type: Opaque
data:
  {{ $v.internalApiCA.key }}: {{ $internalCA | b64enc }}
