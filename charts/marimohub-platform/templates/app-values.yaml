{{- /*
The app chart values that point at what this chart created. Export them with
  kubectl -n <namespaces.app> get configmap marimohub-platform-values -o jsonpath='{.data.values\.yaml}' > platform-values.yaml
and pass the file to helm install marimohub with -f. Holds no secret values.
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: marimohub-platform-values
  namespace: {{ .Values.namespaces.app }}
  labels:
    {{- include "platform.labels" . | nindent 4 }}
data:
  values.yaml: |
    # Generated by the {{ .Release.Name }} release of {{ .Chart.Name }} {{ .Chart.Version }}.
    {{- include "platform.appValues" . | nindent 4 }}
