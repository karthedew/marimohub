# Assumes the Prometheus Operator CRD (monitoring.coreos.com/v1
# ServiceMonitor) is already installed cluster-wide -- this chart never
# probes for it with `lookup`; enabling monitoring.serviceMonitor.enabled
# against a cluster without that CRD fails the release the same way any
# other reference to a missing CRD would, which is the intended fail-closed
# behavior rather than a silent no-op.
{{- if .Values.monitoring.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "marimohub.componentName" (dict "ctx" $ "component" "operator") }}
  namespace: {{ .Values.namespaces.controller }}
  labels:
    {{- include "marimohub.componentLabels" (dict "ctx" $ "component" "operator") | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "marimohub.componentSelectorLabels" (dict "ctx" $ "component" "operator") | nindent 6 }}
  namespaceSelector:
    matchNames:
      - {{ .Values.namespaces.controller }}
  endpoints:
    - port: metrics
      interval: {{ .Values.monitoring.serviceMonitor.interval }}
      {{- if .Values.monitoring.tls.enabled }}
      scheme: https
      tlsConfig:
        {{- if eq .Values.platform "openshift" }}
        # The service CA issues monitoring.tls.secretName from the Service's
        # serving-cert annotation, and OpenShift keeps its bundle current in
        # every namespace as the openshift-service-ca.crt ConfigMap.
        # Prometheus scrapes Pod IPs, so serverName names the Service.
        ca:
          configMap:
            name: openshift-service-ca.crt
            key: service-ca.crt
        serverName: {{ include "marimohub.componentName" (dict "ctx" $ "component" "operator") }}.{{ .Values.namespaces.controller }}.svc
        {{- else }}
        # NetworkPolicy (network.monitoring), not certificate trust, is what
        # actually bounds who can reach this port; skipping verification
        # here avoids requiring Prometheus to separately trust whatever
        # issued monitoring.tls.secretName (an administrator-supplied Secret
        # on the portable profile) while still keeping the wire itself
        # encrypted.
        insecureSkipVerify: true
        {{- end }}
      {{- end }}
{{- end }}
