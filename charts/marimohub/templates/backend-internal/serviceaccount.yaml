# Automounted: backend-internal performs named get reads of MarimoSession CRs
# and their credential Secret to verify a presented RUNTIME_CREDENTIAL (see
# templates/rbac/backend-internal-role.yaml), which requires a live token to
# authenticate to the Kubernetes API. This is a distinct ServiceAccount from
# backend-public's -- the whole point of ADR 0001's split is that these two
# processes never share a permission set.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "marimohub.componentName" (dict "ctx" $ "component" "backend-internal") }}
  namespace: {{ .Values.namespaces.app }}
  labels:
    {{- include "marimohub.componentLabels" (dict "ctx" $ "component" "backend-internal") | nindent 4 }}
automountServiceAccountToken: true
