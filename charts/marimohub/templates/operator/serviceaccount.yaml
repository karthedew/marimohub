# Automounted: the operator authenticates to the Kubernetes API for every
# MarimoSession/Pod/Service/Secret/ResourceQuota read and write in
# templates/rbac/operator-role.yaml, plus Lease-based leader election in its
# own namespace.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "marimohub.componentName" (dict "ctx" $ "component" "operator") }}
  namespace: {{ .Values.namespaces.controller }}
  labels:
    {{- include "marimohub.componentLabels" (dict "ctx" $ "component" "operator") | nindent 4 }}
automountServiceAccountToken: true
