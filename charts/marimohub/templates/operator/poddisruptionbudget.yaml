{{- if gt (.Values.operator.replicaCount | int) 1 }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "marimohub.componentName" (dict "ctx" $ "component" "operator") }}
  namespace: {{ .Values.namespaces.controller }}
  labels:
    {{- include "marimohub.componentLabels" (dict "ctx" $ "component" "operator") | nindent 4 }}
spec:
  # AlwaysAllow: an unhealthy Pod (failing readiness) should never
  # itself block a voluntary eviction the way a healthy one legitimately
  # would.
  unhealthyPodEvictionPolicy: AlwaysAllow
  minAvailable: {{ .Values.operator.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "marimohub.componentSelectorLabels" (dict "ctx" $ "component" "operator") | nindent 6 }}
{{- end }}
