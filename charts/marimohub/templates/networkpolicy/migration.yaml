# Alembic only ever needs to reach PostgreSQL; it has no Kubernetes API
# access at all (see templates/migration/serviceaccount.yaml), so there is
# no Kubernetes API egress rule here either.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "marimohub.componentName" (dict "ctx" $ "component" "migration") }}
  namespace: {{ .Values.namespaces.app }}
  labels:
    {{- include "marimohub.componentLabels" (dict "ctx" $ "component" "migration") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "marimohub.componentSelectorLabels" (dict "ctx" $ "component" "migration") | nindent 6 }}
  policyTypes: ["Ingress", "Egress"]
  egress:
    - to:
        - namespaceSelector: {}
      ports:
        {{- toYaml .Values.network.dns.ports | nindent 8 }}
    {{- if .Values.network.database.cidrs }}
    - to:
        {{- range .Values.network.database.cidrs }}
        - ipBlock:
            cidr: {{ . }}
        {{- end }}
      ports:
        - port: {{ .Values.network.database.port }}
          protocol: TCP
    {{- end }}
