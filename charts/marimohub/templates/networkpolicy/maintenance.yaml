# Covers both maintenance CronJobs (reconcile-runtimes and
# purge-workspaces): each needs PostgreSQL for its own database sweep plus
# the Kubernetes API to list/delete stale MarimoSession CRs through the same
# KubeSessionManager backend-public uses.
{{- range list "reconcile-runtimes" "purge-workspaces" }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "marimohub.componentName" (dict "ctx" $ "component" .) }}
  namespace: {{ $.Values.namespaces.app }}
  labels:
    {{- include "marimohub.componentLabels" (dict "ctx" $ "component" .) | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "marimohub.componentSelectorLabels" (dict "ctx" $ "component" .) | nindent 6 }}
  policyTypes: ["Ingress", "Egress"]
  egress:
    - to:
        - namespaceSelector: {}
      ports:
        {{- toYaml $.Values.network.dns.ports | nindent 8 }}
    {{- if $.Values.network.database.cidrs }}
    - to:
        {{- range $.Values.network.database.cidrs }}
        - ipBlock:
            cidr: {{ . }}
        {{- end }}
      ports:
        - port: {{ $.Values.network.database.port }}
          protocol: TCP
    {{- end }}
    {{- if $.Values.network.kubernetesApi.cidrs }}
    - to:
        {{- range $.Values.network.kubernetesApi.cidrs }}
        - ipBlock:
            cidr: {{ . }}
        {{- end }}
      ports:
        - port: {{ $.Values.network.kubernetesApi.port }}
          protocol: TCP
    {{- end }}
{{- end }}
