# The operator never proxies to a Runtime Pod over the network -- every
# Runtime interaction is a Kubernetes API call against Pod/Service/Secret
# objects, not a direct HTTP connection -- so its only egress needs are DNS
# and the API server itself.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "marimohub.componentName" (dict "ctx" $ "component" "operator") }}
  namespace: {{ .Values.namespaces.controller }}
  labels:
    {{- include "marimohub.componentLabels" (dict "ctx" $ "component" "operator") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "marimohub.componentSelectorLabels" (dict "ctx" $ "component" "operator") | nindent 6 }}
  policyTypes: ["Ingress", "Egress"]
  {{- if .Values.network.monitoring.enabled }}
  ingress:
    - from:
        - namespaceSelector:
            {{- .Values.network.monitoring.namespaceSelector | toYaml | nindent 12 }}
          podSelector:
            {{- .Values.network.monitoring.podSelector | toYaml | nindent 12 }}
      ports:
        - port: {{ .Values.operator.metricsPort }}
          protocol: TCP
  {{- end }}
  egress:
    - to:
        - namespaceSelector: {}
      ports:
        {{- toYaml .Values.network.dns.ports | nindent 8 }}
    {{- if .Values.network.kubernetesApi.cidrs }}
    - to:
        {{- range .Values.network.kubernetesApi.cidrs }}
        - ipBlock:
            cidr: {{ . }}
        {{- end }}
      ports:
        - port: {{ .Values.network.kubernetesApi.port }}
          protocol: TCP
    {{- end }}
