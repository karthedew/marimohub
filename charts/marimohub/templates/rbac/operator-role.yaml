# Mirrors marimohub-operator/config/rbac/role.yaml exactly: the operator
# never creates, changes, or adopts MarimoSession spec/metadata or credential
# Secrets (see the Resource Ownership table), so this Role only ever grants
# read/delete on the main resource, write on the status subresource, and
# full lifecycle on the Pods/Services it does own. Secret access stays
# get/list/watch -- list/watch back the metadata-only informer cache the
# reconciler's Secret mapper uses, and the one place Secret content is ever
# read is a direct, uncached named get (see checkCredentials).
#
# update on marimosessions/finalizers is not finalizer use (the operator sets
# none). Every Pod and Service it creates carries a controller ownerReference
# with blockOwnerDeletion=true, and the OwnerReferencesPermissionEnforcement
# admission plugin, on by default in OpenShift, rejects that field unless the
# caller may update the owner's finalizers subresource. Custom resources serve
# no finalizers subresource, so this grant opens no write path of its own.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "marimohub.componentName" (dict "ctx" $ "component" "operator") }}
  namespace: {{ .Values.namespaces.sessions }}
  labels:
    {{- include "marimohub.componentLabels" (dict "ctx" $ "component" "operator") | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
  - apiGroups: [""]
    resources: ["pods", "services"]
    verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
  - apiGroups: [""]
    resources: ["resourcequotas"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["marimohub.io"]
    resources: ["marimosessions"]
    verbs: ["delete", "get", "list", "watch"]
  - apiGroups: ["marimohub.io"]
    resources: ["marimosessions/finalizers"]
    verbs: ["update"]
  - apiGroups: ["marimohub.io"]
    resources: ["marimosessions/status"]
    verbs: ["get", "patch", "update"]
