# A regular (non-hook) resource, unlike the migration Job's ServiceAccount:
# a pre-delete hook fires while the release's ordinary resources -- this one
# included -- still exist (Helm deletes them only after every pre-delete
# hook succeeds), so there is nothing to stand up early the way a
# pre-install hook's own supporting objects need to be. Automounted: the
# drain script authenticates to the Kubernetes API to list/delete every
# MarimoSession and watch its owned Pods/Services/Secrets disappear (see
# uninstall-drain-role.yaml). Runs in namespaces.app like the migration Job
# and maintenance CronJobs -- the objects it manages live in
# namespaces.sessions, but the identity that manages them is chart
# application tooling, not itself a Runtime.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "marimohub.componentName" (dict "ctx" $ "component" "uninstall-drain") }}
  namespace: {{ .Values.namespaces.app }}
  labels:
    {{- include "marimohub.componentLabels" (dict "ctx" $ "component" "uninstall-drain") | nindent 4 }}
automountServiceAccountToken: true
