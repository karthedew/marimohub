apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "marimohub.componentName" (dict "ctx" $ "component" "uninstall-drain") }}
  namespace: {{ .Values.namespaces.sessions }}
  labels:
    {{- include "marimohub.componentLabels" (dict "ctx" $ "component" "uninstall-drain") | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "marimohub.componentName" (dict "ctx" $ "component" "uninstall-drain") }}
subjects:
  - kind: ServiceAccount
    name: {{ include "marimohub.componentName" (dict "ctx" $ "component" "uninstall-drain") }}
    namespace: {{ .Values.namespaces.app }}
