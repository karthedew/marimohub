# Automounted: backend-public creates/gets/lists/patches/deletes MarimoSession
# CRs and creates/gets their credential Secret in the sessions namespace (see
# templates/rbac/backend-public-role.yaml), which requires a live token to
# authenticate to the Kubernetes API.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "marimohub.componentName" (dict "ctx" $ "component" "backend-public") }}
  namespace: {{ .Values.namespaces.app }}
  labels:
    {{- include "marimohub.componentLabels" (dict "ctx" $ "component" "backend-public") | nindent 4 }}
automountServiceAccountToken: true
