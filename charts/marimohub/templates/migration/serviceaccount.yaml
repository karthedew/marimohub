# Never automounted and granted no RBAC anywhere in this chart (there is no
# migration Role/RoleBinding): Alembic only ever talks to the database, so
# this identity has zero Kubernetes API surface to abuse even if the
# container it runs were compromised. Hook-scoped like the Job it backs, so
# a re-run install/upgrade replaces rather than reuses it.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "marimohub.componentName" (dict "ctx" $ "component" "migration") }}
  namespace: {{ .Values.namespaces.app }}
  labels:
    {{- include "marimohub.componentLabels" (dict "ctx" $ "component" "migration") | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
automountServiceAccountToken: false
