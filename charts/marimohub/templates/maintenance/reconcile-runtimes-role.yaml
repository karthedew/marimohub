# get/list back `reconcilable_runtimes`'s listing and stop()'s pre-delete
# read; delete backs stop() itself. No create/patch (this command never
# starts a Runtime) and no secrets rule at all: it never reads or writes one
# directly, only ever deletes the owning CR.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "marimohub.componentName" (dict "ctx" $ "component" "reconcile-runtimes") }}
  namespace: {{ .Values.namespaces.sessions }}
  labels:
    {{- include "marimohub.componentLabels" (dict "ctx" $ "component" "reconcile-runtimes") | nindent 4 }}
rules:
  - apiGroups: ["marimohub.io"]
    resources: ["marimosessions"]
    verbs: ["get", "list", "delete"]
