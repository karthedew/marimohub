# Automounted for the same reason reconcile-runtimes' ServiceAccount is:
# `app.commands.purge_archived_workspaces` stops every Runtime belonging to
# a workspace whose purge deadline has passed through the same
# KubeSessionManager, using an identical get/list/delete-only Role.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "marimohub.componentName" (dict "ctx" $ "component" "purge-workspaces") }}
  namespace: {{ .Values.namespaces.app }}
  labels:
    {{- include "marimohub.componentLabels" (dict "ctx" $ "component" "purge-workspaces") | nindent 4 }}
automountServiceAccountToken: true
