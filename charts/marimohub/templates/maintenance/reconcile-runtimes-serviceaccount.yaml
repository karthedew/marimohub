# Automounted: `app.commands.reconcile_runtimes` lists/stops stale Runtime
# CRs through the same KubeSessionManager backend-public uses, which
# requires a live token. Its own Role (see reconcile-runtimes-role.yaml)
# grants only get/list/delete on marimosessions -- never create/patch, and
# never Secrets: this command only ever removes a Runtime whose owning
# Workspace/Notebook/Deployment state no longer justifies it, and
# owner-reference GC removes its Pod/Service/Secret children on its own.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "marimohub.componentName" (dict "ctx" $ "component" "reconcile-runtimes") }}
  namespace: {{ .Values.namespaces.app }}
  labels:
    {{- include "marimohub.componentLabels" (dict "ctx" $ "component" "reconcile-runtimes") | nindent 4 }}
automountServiceAccountToken: true
