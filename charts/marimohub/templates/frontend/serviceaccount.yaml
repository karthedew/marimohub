# The frontend never calls the Kubernetes API -- it only serves the built
# SvelteKit app and proxies its own server-side data loads to backend-public
# over plain HTTP(S) -- so its token is never mounted at all.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "marimohub.componentName" (dict "ctx" $ "component" "frontend") }}
  namespace: {{ .Values.namespaces.app }}
  labels:
    {{- include "marimohub.componentLabels" (dict "ctx" $ "component" "frontend") | nindent 4 }}
automountServiceAccountToken: false
