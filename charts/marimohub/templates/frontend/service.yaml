apiVersion: v1
kind: Service
metadata:
  name: {{ include "marimohub.componentName" (dict "ctx" $ "component" "frontend") }}
  namespace: {{ .Values.namespaces.app }}
  labels:
    {{- include "marimohub.componentLabels" (dict "ctx" $ "component" "frontend") | nindent 4 }}
  {{- if and .Values.openshift.serviceServingCerts.enabled .Values.frontend.tls.secretName }}
  annotations:
    service.beta.openshift.io/serving-cert-secret-name: {{ .Values.frontend.tls.secretName }}
  {{- end }}
spec:
  selector:
    {{- include "marimohub.componentSelectorLabels" (dict "ctx" $ "component" "frontend") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.frontend.port }}
      targetPort: http
      protocol: TCP
