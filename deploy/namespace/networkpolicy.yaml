# Default-deny session isolation: only the API/gateway may reach a session
# pod on 8080, and a session pod may reach only the API on 8000 plus DNS.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: session-isolation
  namespace: marimohub-sessions
spec:
  podSelector:
    matchLabels:
      app: marimo-session
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: marimohub
          podSelector:
            matchLabels:
              app: marimohub-api
      ports:
        - port: 8080
          protocol: TCP
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: marimohub
          podSelector:
            matchLabels:
              app: marimohub-api
      ports:
        - port: 8000
          protocol: TCP
    - to:
        - namespaceSelector: {}
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
