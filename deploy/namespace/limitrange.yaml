# Per-container defaults/ceilings so a MarimoSession CR can't request the world.
apiVersion: v1
kind: LimitRange
metadata:
  name: session-limits
  namespace: marimohub-sessions
spec:
  limits:
    - type: Container
      default:
        cpu: "1"
        memory: 2Gi
      defaultRequest:
        cpu: 250m
        memory: 512Mi
      max:
        cpu: "2"
        memory: 4Gi
