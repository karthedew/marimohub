# Hard cap on the marimohub-sessions namespace; replaces the in-process
# MAX_CONCURRENT_SESSIONS gate — a quota-exceeded Pod create surfaces to the
# backend as a create failure and maps to SessionCapacityError (429).
apiVersion: v1
kind: ResourceQuota
metadata:
  name: session-quota
  namespace: marimohub-sessions
spec:
  hard:
    pods: "50"
    requests.cpu: "12"
    requests.memory: 24Gi
    limits.cpu: "50"
    limits.memory: 100Gi
