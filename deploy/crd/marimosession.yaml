apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: marimosessions.marimohub.io
spec:
  group: marimohub.io
  scope: Namespaced
  names:
    kind: MarimoSession
    plural: marimosessions
    singular: marimosession
    shortNames:
      - msess
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Mode
          type: string
          jsonPath: .spec.mode
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Notebook
          type: string
          jsonPath: .spec.notebookId
        - name: Service
          type: string
          jsonPath: .status.serviceName
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [notebookId, workspaceId, mode]
              properties:
                notebookId:
                  type: string
                  format: uuid
                workspaceId:
                  type: string
                  format: uuid
                creatorId:
                  type: string
                  format: uuid
                  nullable: true
                mode:
                  type: string
                  enum: [edit, run, deploy]
                image:
                  type: string
                  description: Marimo runtime image; defaults from controller config when empty.
                baseUrl:
                  type: string
                  description: Proxy path prefix marimo is served under; maps to --base-url.
                idleTimeoutSeconds:
                  type: integer
                  default: 600
                  minimum: 30
                resources:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                  description: corev1.ResourceRequirements passthrough.
            status:
              type: object
              properties:
                phase:
                  type: string
                  enum: [Pending, Starting, Ready, Sleeping, Failed]
                serviceName:
                  type: string
                podName:
                  type: string
                lastActivity:
                  type: string
                  format: date-time
                message:
                  type: string
                observedGeneration:
                  type: integer
