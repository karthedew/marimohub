[project]
name = "backend"
version = "0.1.0"
description = "MoLab FastAPI backend"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.4",
    "asyncpg>=0.31.0",
    "authlib>=1.3.0",
    "bcrypt>=5.0.0",
    "fastapi>=0.137.1",
    "httpx>=0.28.1",
    "joserfc>=1.6.0",
    "kubernetes-asyncio>=32.0.0",
    "marimo>=0.23.10",
    "pgvector>=0.4.2",
    "pydantic-settings>=2.14.1",
    "pyjwt>=2.13.0",
    "sentence-transformers>=5.6.0",
    "sqlalchemy[asyncio]>=2.0.51",
    "torch>=2.9.1",
    "uvicorn[standard]>=0.49.0",
    "websockets>=15.0.1",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
    "complexipy>=5.6.1",
    "psycopg[binary]>=3.3.4",
    "pytest>=9.1.0",
    "pytest-asyncio>=1.4.0",
    "pyyaml>=6.0.3",
    "radon>=6.0.1",
    "ruff>=0.15.20",
    "ty>=0.0.58",
]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
    "integration: tests that launch external runtime processes",
]
