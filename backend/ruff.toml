target-version = "py312"
line-length = 100
src = ["app", "tests"]
fix = true
show-fixes = true
respect-gitignore = true
# Match the analysis surface of the other tools (pyright/complexipy/radon all
# scope to app + tests); spikes/ holds throwaway exploration scripts.
extend-exclude = ["spikes", "reports"]

[format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
docstring-code-format = true

[lint]
select = [
  "E", "W", "F", "I",
  "B", "A", "C4", "DTZ",
  "T10", "EM", "EXE", "FA",
  "ISC", "ICN", "G", "INP",
  "PIE", "PT", "Q", "RET",
  "RSE", "SIM", "T20", "UP",
  "YTT", "ASYNC", "ANN", "S",
  "BLE", "FBT", "N", "PERF",
  "PL", "TRY", "RUF", "D",
]

ignore = [
  "D100",
  "D104",
  "TRY003",
  "EM101",
  "EM102",
]

fixable = ["ALL"]
unfixable = ["F401", "F841"]

[lint.per-file-ignores]
"tests/**/*.py" = [
  "S101",
  "ANN201",
  "D",
  "PLR2004",
]

"app/api/**/*.py" = [
  "B008",
  "FBT001",
  "FBT002",
]

"app/db/migrations/**/*.py" = [
  "D",
  "ANN",
  "S608",
  "INP001",
]

[lint.isort]
known-first-party = ["app"]
combine-as-imports = true
force-sort-within-sections = true

[lint.pydocstyle]
convention = "google"

[lint.flake8-annotations]
mypy-init-return = true
suppress-dummy-args = true
allow-star-arg-any = false

[lint.pylint]
max-args = 6
max-branches = 8
max-returns = 4
max-statements = 40
max-nested-blocks = 3
max-public-methods = 12

[lint.mccabe]
max-complexity = 10
