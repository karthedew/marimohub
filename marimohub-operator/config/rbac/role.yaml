---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: manager-role
  namespace: marimohub-sessions
rules:
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - create
  - patch
- apiGroups:
  - ""
  resources:
  - pods
  - services
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - ""
  resources:
  - resourcequotas
  verbs:
  - get
  - list
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - marimohub.io
  resources:
  - marimosessions
  verbs:
  - delete
  - get
  - list
  - watch
- apiGroups:
  - marimohub.io
  resources:
  - marimosessions/finalizers
  verbs:
  - update
- apiGroups:
  - marimohub.io
  resources:
  - marimosessions/status
  verbs:
  - get
  - patch
  - update
